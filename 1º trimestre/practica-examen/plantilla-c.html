<!doctype html>
<!--
    Práctica integrador - Bloque C (autónomo, nivel examen): SonidoLibre
    Bootstrap 5.3.3 (local, sin internet) se usa SOLO para el aspecto.
    Todo el comportamiento lo escribís vos en JS, agregando y sacando las clases abierto y activo.
    No se usa el JS de Bootstrap.
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SonidoLibre - Bloque C</title>
    <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      /* Este CSS va DESPUÉS de Bootstrap: las clases de estado (abierto, activo) mandan. */

      /* Menú "Perfil": oculto por defecto (como .dropdown-menu), visible con la clase "abierto" */
      .perfil {
        position: relative;
      }
      .menu-perfil {
        top: 100%;
        right: 0;
        left: auto;
        margin: 0;
        min-width: 200px;
      }
      .menu-perfil.abierto {
        display: block;
      }

      /* Panel "Cola": fuera de la pantalla por defecto, entra con la clase "abierto" */
      .panel-cola {
        position: fixed;
        top: 0;
        right: 0;
        width: 300px;
        height: 100%;
        z-index: 1050;
        transform: translateX(100%);
        transition: transform 0.3s;
      }
      .panel-cola.abierto {
        transform: translateX(0);
      }

      /* Géneros */
      .generos button.activo {
        background-color: var(--bs-warning);
        border-color: var(--bs-warning);
        color: #000;
      }

      /* Lista de canciones: los li los crea el JS, por eso se estilan desde acá */
      .lista-canciones {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .lista-canciones li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        margin-bottom: 8px;
        border: 1px solid var(--bs-border-color);
        border-radius: var(--bs-border-radius);
        background-color: var(--bs-body-bg);
      }
      .lista-canciones .emoji {
        font-size: 28px;
      }
      .lista-canciones .titulo {
        font-weight: bold;
      }
      .lista-canciones .artista {
        flex: 1;
        color: var(--bs-secondary-color);
      }
      .lista-canciones .genero {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        background-color: var(--bs-secondary-bg);
      }
      .lista-canciones .duracion {
        font-weight: bold;
        min-width: 50px;
        text-align: right;
      }
    </style>
  </head>
  <body class="bg-light">
    <!-- ===== Cabecera (ejercicios C1 y C2) ===== -->
    <header class="d-flex align-items-center gap-3 px-4 py-2 bg-dark shadow-sm">
      <span class="fw-bold text-warning fs-5">🎧 SonidoLibre</span>

      <button class="btn-cola btn btn-sm btn-outline-warning ms-auto">🎶 Cola</button>

      <div class="perfil">
        <button class="btn-perfil btn btn-sm btn-outline-light">Perfil ▾</button>
        <ul class="menu-perfil dropdown-menu shadow-sm">
          <li><a class="dropdown-item" href="#">Mis listas</a></li>
          <li><a class="dropdown-item" href="#">Ajustes</a></li>
          <li><a class="dropdown-item" href="#">Cerrar sesión</a></li>
        </ul>
      </div>
    </header>

    <!-- Panel lateral "Cola" (ejercicio C2) -->
    <aside class="panel-cola bg-white border-start shadow p-4">
      <h2 class="h5">🎶 Próximas en la cola</h2>
      <ol class="list-group list-group-numbered mb-3">
        <li class="list-group-item">Río Lento</li>
        <li class="list-group-item">Pulso</li>
        <li class="list-group-item">Verano Eterno</li>
      </ol>
      <p class="small text-body-secondary mb-0">Apretá <kbd>Escape</kbd> para cerrar.</p>
    </aside>

    <main class="container py-4" style="max-width: 960px">
      <!-- ===== Lista (ejercicios C3 a C5) ===== -->
      <section class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h1 class="h5 mb-0">Mi lista: Para el viaje</h1>
          <span class="badge bg-warning text-dark">Bloque C</span>
        </div>
        <div class="card-body">
          <div class="generos d-flex flex-wrap gap-2 mb-3">
            <button class="btn btn-sm btn-outline-warning text-dark activo">Todos</button>
            <button class="btn btn-sm btn-outline-warning text-dark">Rock</button>
            <button class="btn btn-sm btn-outline-warning text-dark">Pop</button>
            <button class="btn btn-sm btn-outline-warning text-dark">Electrónica</button>
            <button class="btn btn-sm btn-outline-warning text-dark">Folk</button>
          </div>

          <ul class="lista-canciones"></ul>

          <p class="mb-0 mt-3">
            Canciones: <strong class="cantidad badge text-bg-dark">0</strong> · Duración total:
            <strong class="total badge bg-warning text-dark">0 min</strong>
          </p>
        </div>
      </section>
    </main>

    <script>
      // ===== DATOS (no modificar) =====
      const canciones = [
        { id: 1, titulo: "Luces de Neón", artista: "Los Faroles", genero: "Electrónica", duracion: 4, emoji: "💡" },
        { id: 2, titulo: "Camino al Sur", artista: "Ana Brisa", genero: "Folk", duracion: 3, emoji: "🌄" },
        { id: 3, titulo: "Ruido Blanco", artista: "Trueno Sur", genero: "Rock", duracion: 5, emoji: "⚡" },
        { id: 4, titulo: "Bailando Sola", artista: "Mía Ventura", genero: "Pop", duracion: 3, emoji: "💃" },
        { id: 5, titulo: "Pulso", artista: "Circuito 8", genero: "Electrónica", duracion: 6, emoji: "🎛️" },
        { id: 6, titulo: "Río Lento", artista: "Ana Brisa", genero: "Folk", duracion: 4, emoji: "🌊" },
        { id: 7, titulo: "Cuerdas Rotas", artista: "Trueno Sur", genero: "Rock", duracion: 4, emoji: "🎸" },
        { id: 8, titulo: "Verano Eterno", artista: "Mía Ventura", genero: "Pop", duracion: 3, emoji: "☀️" },
        { id: 9, titulo: "Medianoche", artista: "Circuito 8", genero: "Electrónica", duracion: 5, emoji: "🌙" },
        { id: 10, titulo: "Fogata", artista: "Los Leños", genero: "Folk", duracion: 2, emoji: "🔥" },
      ];

      // ===== TU CÓDIGO ACÁ =====
      // Antes de cada ejercicio, escribí:
      // Decisión: <método o evento>, porque <una línea con el porqué>.
      const botonPerfil = document.querySelector(".btn-perfil");
      const menuPerfil = document.querySelector(".menu-perfil");
      const doc = document;

      //------------------------------C.1-------------------------------
      //Decisión: un evento de click para el botón y que cuando se clica se añada la clase abierto y para cerrarlo usamos document ya que hay que clicar en cualquier parte y no body porque el body es muy pequeño, además stopPropagation para que no se cierre al instante 
      botonPerfil.addEventListener("click", (e) => {
        menuPerfil.classList.add("abierto");
        e.stopPropagation();
      });

      doc.addEventListener("click", () => {
        menuPerfil.classList.remove("abierto");
      });

      //------------------------------C.2-------------------------------
      //Decisión: click en botón para abrir el panel y en document añadir evento de tecla para que pueda leer escape y si es escape, cierre el panel
      const btnCola = document.querySelector(".btn-cola");
      const panelCola = document.querySelector(".panel-cola");

      btnCola.addEventListener("click", (e) => {
        panelCola.classList.add("abierto");
      });

      doc.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          panelCola.classList.remove("abierto");
        }
      });
    </script>
  </body>
</html>
