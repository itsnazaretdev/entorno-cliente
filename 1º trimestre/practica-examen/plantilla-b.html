<!doctype html>
<!--
    Práctica integrador - Bloque B (semiguiado): El Fogón de la Esquina
    Bootstrap 5.3.3 (local, sin internet) se usa SOLO para el aspecto.
    Todo el comportamiento lo escribís vos en JS, agregando y sacando las clases activo y seleccionado.
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Fogón de la Esquina - Bloque B</title>
    <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      /* Este CSS va DESPUÉS de Bootstrap: las clases de estado (activo, seleccionado) mandan. */
      .tipos button.activo {
        background-color: var(--bs-warning);
        border-color: var(--bs-warning);
        color: #000;
      }

      /* Menú: los li los crea el JS, por eso se estilan desde acá */
      .menu {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .menu li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        margin-bottom: 8px;
        border: 1px solid var(--bs-border-color);
        border-radius: var(--bs-border-radius);
        background-color: var(--bs-body-bg);
        cursor: pointer;
      }
      .menu li:hover {
        background-color: var(--bs-tertiary-bg);
      }
      .menu .emoji {
        font-size: 28px;
      }
      .menu .nombre {
        font-weight: bold;
        flex: 1;
      }
      .menu .tipo {
        font-size: 12px;
        color: var(--bs-secondary-color);
      }
      .menu .precio {
        font-weight: bold;
        color: var(--bs-success);
        min-width: 50px;
        text-align: right;
      }
      .menu li.seleccionado {
        box-shadow: inset 0 0 0 2px var(--bs-warning);
        background-color: var(--bs-warning-bg-subtle);
      }

      /* Detalle del plato elegido */
      .detalle-emoji {
        font-size: 64px;
        line-height: 1;
      }
    </style>
  </head>
  <body class="bg-light">
    <header class="d-flex align-items-center gap-4 px-4 py-2 bg-dark shadow-sm">
      <span class="fw-bold text-warning fs-5">🔥 El Fogón de la Esquina</span>
      <span class="text-white-50 small">Carta del día</span>
    </header>

    <main class="container py-4" style="max-width: 960px">
      <div class="row g-4">
        <section class="col-md-7">
          <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
              <h1 class="h5 mb-0">Carta</h1>
              <span class="badge bg-warning text-dark">Bloque B</span>
            </div>
            <div class="card-body">
              <div class="tipos d-flex flex-wrap gap-2 mb-3">
                <button class="btn btn-sm btn-outline-warning text-dark activo">Todos</button>
                <button class="btn btn-sm btn-outline-warning text-dark">Entrante</button>
                <button class="btn btn-sm btn-outline-warning text-dark">Principal</button>
                <button class="btn btn-sm btn-outline-warning text-dark">Postre</button>
                <button class="btn btn-sm btn-outline-warning text-dark">Bebida</button>
              </div>

              <ul class="menu"></ul>

              <p class="mb-0 mt-3">
                Platos: <strong class="cantidad badge text-bg-dark">0</strong> · Uno de cada:
                <strong class="total badge bg-warning text-dark">0 €</strong>
              </p>
            </div>
          </div>
        </section>

        <aside class="col-md-5">
          <div class="detalle card shadow-sm">
            <div class="card-header">
              <h2 class="h5 mb-0">Detalle</h2>
            </div>
            <div class="card-body text-center">
              <div class="detalle-emoji mb-2">🍽️</div>
              <h3 class="detalle-nombre h5">Elegí un plato</h3>
              <p class="detalle-descripcion text-body-secondary">Hacé clic en un plato de la carta para ver el detalle.</p>
              <p class="detalle-precio fs-4 fw-bold text-success mb-0"></p>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <script>

      // ===== TU CÓDIGO ACÁ =====
      // Antes de cada ejercicio, escribí:

      let tipoActivo = "Todos";
      let seleccionado = null; // el plato elegido (objeto), o null si todavía no hay
      let platosCopia = platos

       function obtenerFiltrado() {
        if (tipoActivo !== "Todos") {
          platosCopia = platos.filter((plato) => plato.tipo === tipoActivo);
        } else {
          platosCopia = platos;
        }
      }

      //------------------------------B.1-------------------------------
      //Decisión: función renderizar para ver los platos en un li para cada uno con forEach

      const ulMenu = document.querySelector(".menu");
      let platosTotal = document.querySelector(".cantidad")
      let unoDeCada = document.querySelector(".total")
      const botones = document.querySelector

      function renderizar() {
        obtenerFiltrado()

        ulMenu.innerHTML = ""

        platosCopia.forEach(plato => {
            const liMenu = document.createElement("li");

            liMenu.innerHTML = `
                <span class="emoji">${plato.emoji}</span>
                <span class="titulo">${plato.nombre}</span>
                <span class="genero">${plato.tipo}</span>
                <span class="duracion">${plato.precio} €</span>
            `;
            ulMenu.appendChild(liMenu)

            // if (plato[i] === seleccionado) {
            //     liMenu.classList.add("seleccionado")
            // } else {
            //     liMenu.classList.remove("seleccionado")
            // }
        })

        //------------------------------B.4-------------------------------
        //Decisión: uso de lenght para ver cuánto es la longitud de la lista que se está renderizando y reduce para calcular el precio total de todos los que hay en la lista
        let platosCount = platosCopia.length;
        platosTotal.textContent = platosCount;

        let unoDeCadaTotal = platosCopia.reduce((acc, plato) => acc + plato.precio, 0)
        unoDeCada.textContent = `${unoDeCadaTotal} €`
        

      }

      //------------------------------B.2-------------------------------
      //Decisión: usar filter para sacar un array con los platos que según el botón clicado, renderice exactamente esos, uso la función de obetener filtrado arriba para que según el tipo renderice o no
      const divBotones = document.querySelector(".tipos")

      divBotones.addEventListener("click", (e) => {
        const boton = e.target.closest("button")
        const filtrado = platosCopia.filter(copia => copia.tipo === tipoActivo)
        
        if (boton === null) return;

        tipoActivo = boton.textContent
        
        renderizar()
      })

     



      renderizar()

    </script>
  </body>
</html>
